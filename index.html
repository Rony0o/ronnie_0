<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#263451">
  <meta name="description" content="A little corner of the internet.">
  <title>R — Links</title>
  <style>
    :root {
      color-scheme: dark;
      --page-a: #202d49;
      --page-b: #293858;
      --panel: rgba(226, 231, 244, .15);
      --panel-border: rgba(224, 230, 244, .57);
      --button: #e2e5ef;
      --button-text: #59657e;
      --button-icon: #7a849b;
      --muted: rgba(112, 125, 155, .45);
      --avatar-a: #f1f3ff;
      --avatar-b: #a9b9e4;
      --ink: #f5f6ff;
      --shadow: rgba(10, 18, 39, .16);
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 28px 20px;
      overflow-x: hidden;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 51% 28%, rgba(177, 192, 226, .14), transparent 35%),
        radial-gradient(ellipse at 6% 83%, rgba(112, 133, 181, .13), transparent 28%),
        linear-gradient(145deg, var(--page-a), var(--page-b));
      transition: background .35s ease, color .35s ease;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .18;
      background:
        linear-gradient(78deg, transparent 0 28%, rgba(255,255,255,.055) 28.2%, transparent 29%),
        linear-gradient(112deg, transparent 0 71%, rgba(255,255,255,.035) 71.2%, transparent 72%);
    }

    .profile-card {
      position: relative;
      isolation: isolate;
      width: min(100%, 660px);
      min-height: 880px;
      padding: 42px 32px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid var(--panel-border);
      border-radius: 43px;
      background: linear-gradient(150deg, rgba(231,235,247,.17), rgba(27,39,67,.23) 48%, rgba(28,41,70,.32));
      box-shadow: 0 22px 70px var(--shadow), inset 0 1px 0 rgba(255,255,255,.08);
      backdrop-filter: blur(23px);
      -webkit-backdrop-filter: blur(23px);
    }

    .utility {
      position: absolute;
      top: 42px;
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      transition: transform .2s ease, background .2s ease;
    }
    .utility:hover { transform: translateY(-2px); }
    .utility:active { transform: scale(.96); }
    .theme-toggle { left: 32px; color: #56627b; background: #f6f7fb; }
    .share-button { right: 32px; color: #4e5b75; background: rgba(225,229,241,.77); }
    .utility svg { width: 25px; height: 25px; }

    .avatar {
      width: 152px;
      height: 152px;
      margin-top: 112px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 7px solid rgba(255,255,255,.82);
      border-radius: 50%;
      color: #536487;
      background: linear-gradient(145deg, var(--avatar-a), var(--avatar-b));
      box-shadow: 0 2px 7px rgba(8,16,39,.13), inset 0 1px 4px rgba(255,255,255,.7);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 66px;
      line-height: 1;
      font-weight: 400;
    }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 19px;
      margin-top: 164px;
    }
    .social-link {
      min-height: 96px;
      width: 100%;
      padding: 0 34px;
      display: grid;
      grid-template-columns: 28px 1fr 20px;
      align-items: center;
      column-gap: 18px;
      border: 1px solid rgba(255,255,255,.3);
      border-radius: 22px;
      color: var(--button-text);
      background: var(--button);
      box-shadow: 0 7px 18px rgba(11,20,42,.055);
      text-decoration: none;
      transition: transform .22s ease, box-shadow .22s ease, background .22s ease;
    }
    .social-link:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 25px rgba(8,16,36,.15);
      background: #edf0f8;
    }
    .social-link:active { transform: scale(.99); }
    .social-link .brand-icon { width: 28px; height: 28px; color: var(--button-icon); }
    .social-link .label {
      text-align: center;
      font-size: 18px;
      line-height: 1.2;
      letter-spacing: 2px;
      font-weight: 750;
    }
    .social-link .external {
      width: 19px;
      height: 19px;
      color: #aeb6c8;
      justify-self: end;
    }

    footer {
      margin-top: auto;
      padding-top: 48px;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
      letter-spacing: 4px;
      line-height: 1.5;
      font-weight: 600;
      white-space: nowrap;
    }

    body.light {
      color-scheme: light;
      --page-a: #e9edf7;
      --page-b: #cbd5eb;
      --panel: rgba(255,255,255,.36);
      --panel-border: rgba(255,255,255,.8);
      --button: #f4f5fa;
      --button-text: #59657e;
      --button-icon: #7a849b;
      --muted: rgba(83, 99, 133, .53);
      --ink: #273653;
      --shadow: rgba(50, 65, 100, .12);
    }
    body.light .profile-card {
      background: linear-gradient(150deg, rgba(255,255,255,.48), rgba(218,226,244,.34));
    }

    button:focus-visible, a:focus-visible {
      outline: 3px solid #a9c6ff;
      outline-offset: 4px;
    }

    @media (min-width: 900px) {
      .profile-card { min-height: min(900px, calc(100vh - 56px)); }
      .avatar { margin-top: 112px; }
      .links { margin-top: 150px; }
    }
    @media (max-width: 520px) {
      body { padding: 18px 14px; }
      .profile-card {
        min-height: min(880px, calc(100svh - 36px));
        padding: 28px 22px 27px;
        border-radius: 36px;
      }
      .utility { top: 27px; width: 56px; height: 56px; }
      .theme-toggle { left: 22px; }
      .share-button { right: 22px; }
      .avatar { width: 136px; height: 136px; margin-top: 100px; font-size: 60px; }
      .links { margin-top: clamp(105px, 18vh, 164px); gap: 16px; }
      .social-link { min-height: 82px; padding: 0 24px; border-radius: 20px; }
      .social-link .label { font-size: 16px; letter-spacing: 1.8px; }
      footer { font-size: 11px; letter-spacing: 2.7px; padding-top: 38px; }
    }
    @media (max-height: 760px) {
      body { padding-top: 14px; padding-bottom: 14px; }
      .profile-card { min-height: 690px; padding-top: 24px; padding-bottom: 22px; }
      .utility { top: 24px; }
      .avatar { margin-top: 84px; width: 124px; height: 124px; font-size: 55px; }
      .links { margin-top: 95px; gap: 13px; }
      .social-link { min-height: 76px; }
      footer { padding-top: 28px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="profile-card" aria-label="Personal links">
    <button class="utility theme-toggle" id="themeToggle" type="button" aria-label="Toggle light and dark appearance" title="Toggle appearance">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>
      </svg>
    </button>

    <button class="utility share-button" id="shareButton" type="button" aria-label="Share this page" title="Share this page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 15V3m-4 4 4-4 4 4"></path><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"></path>
      </svg>
    </button>

    <div class="avatar" aria-label="Profile initial R">R</div>

    <nav class="links" aria-label="Social media links">
      <a class="social-link" href="https://boxd.it/jEd1D" target="_blank" rel="noopener noreferrer">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3.5" y="3" width="17" height="18" rx="2"></rect><path d="M9 3v18M15 3v18M3.5 8h5.5M15 8h5.5M3.5 16h5.5M15 16h5.5"></path>
        </svg>
        <span class="label">LETTERBOXD</span>
        <svg class="external" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"></path></svg>
      </a>

      <a class="social-link" href="https://www.instagram.com/ronnie_0_o?psln=MW5pdWwybDFsZzVodA==" target="_blank" rel="noopener noreferrer">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><path d="M17.5 6.5h.01"></path>
        </svg>
        <span class="label">INSTAGRAM</span>
        <svg class="external" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"></path></svg>
      </a>
    </nav>

    <footer>MADE USING AI IN JUST 2 MINUTES</footer>
  </main>

  <script>
    const themeToggle = document.getElementById("themeToggle");
    const themeIcon = document.getElementById("themeIcon");
    const shareButton = document.getElementById("shareButton");

    themeToggle.addEventListener("click", () => {
      const isLight = document.body.classList.toggle("light");
      themeToggle.setAttribute("aria-label", isLight ? "Switch to dark appearance" : "Switch to light appearance");
      themeIcon.innerHTML = isLight
        ? '<path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"></path>'
        : '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>';
    });

    shareButton.addEventListener("click", async () => {
      const shareData = { title: document.title, text: "A little corner of the internet", url: window.location.href };
      try {
        if (navigator.share) {
          await navigator.share(shareData);
        } else if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(window.location.href);
          shareButton.title = "Link copied";
          window.setTimeout(() => shareButton.title = "Share this page", 1800);
        } else {
          window.prompt("Copy this page link:", window.location.href);
        }
      } catch (error) {
        if (error.name !== "AbortError") console.error("Unable to share page:", error);
      }
    });
  </script>
</body>
</html>
